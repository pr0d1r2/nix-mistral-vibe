---
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier-1: built, checked and cached, one native runner per system. No qemu
  # and no cross: a cross-built path is a different store path and never the
  # one consumers substitute. Each runner also evaluates only its own system:
  # upstream's flake reads a derivation's output while evaluating (SPEC B4).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      # Pushes only from a push to main (V4). PRs, forks included, still read
      # the cache. The filter keeps sources and tarballs out of it (V5).
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: Build
        run: nix build --print-build-logs ".#packages.$SYSTEM.mistral-vibe" ".#packages.$SYSTEM.rustCli"
      # This system's checks, version among them (V1, V3).
      - name: Flake check
        run: nix flake check --print-build-logs

  # Does the cache have what main built? A separate job, because cachix pushes
  # in its post step and a failed push does not fail the build job (V13).
  verify-cache:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Every package is in the cache
        run: ./scripts/verify-cache.sh "$SYSTEM" mistral-vibe rustCli

  # Tier-2: x86_64-darwin must evaluate (V11) but is never built or pushed.
  # Evaluation needs an x86_64-darwin builder, which an Apple silicon runner
  # provides through Rosetta 2.
  tier2-eval:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-platforms = x86_64-darwin
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - name: Evaluate x86_64-darwin
        run: nix eval --raw .#packages.x86_64-darwin.mistral-vibe.drvPath

  # One nixpkgs node per lock, at the rev nixpkgs-lock publishes (V7, V8,
  # V18). Drift has no other symptom than a silent cache miss.
  assert-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
      - name: Pins match nixpkgs-lock
        run: ./scripts/assert-pins.sh

  # The same hk gate the hooks run, from the same dev shell (V19).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          pushFilter: '(-source$|nixpkgs\.tar\.gz$)'
      - name: hk check
        run: nix develop ./dev --command hk check --all
      - name: pklith confirm
        run: nix develop ./dev --command pklith confirm
